<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | DesignersHub</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <header>
        <div class="container nav">
            <a href="../index.html" class="logo">DESIGNERS HUB ADMIN</a>
            <div class="nav-links">
                <a href="../blog/index.html">View Blog</a>
                <a href="../community/index.html">View Community</a>
            </div>
            <div id="authContainer"></div>
        </div>
    </header>

    <main class="container" style="padding-top: var(--space-xl);">
        <header style="margin-bottom: var(--space-lg);">
            <h1>Pending Contributions</h1>
            <p style="color: var(--text-secondary);">Review and approve community submitted articles.</p>
        </header>

        <div id="pendingList" style="display: flex; flex-direction: column; gap: var(--space-md);">
            <div class="card" style="text-align: center; padding: var(--space-xl);">
                <p>Checking authorization...</p>
            </div>
        </div>
    </main>

    <script src="../assets/js/database.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        async function checkAdmin() {
            const adminStatus = await isAdmin();
            if (!adminStatus) {
                alert('Access Denied: Admins Only');
                window.location.href = '../index.html';
                return;
            }
            loadPending();
        }

        async function loadPending() {
            const list = document.getElementById('pendingList');

            const { data, error } = await supabase
                .from('community_posts')
                .select('*')
                .eq('status', 'pending')
                .order('created_at', { ascending: false });

            if (error) {
                list.innerHTML = `<div class="card" style="color: #ef4444;">Error loading posts: ${error.message}</div>`;
                return;
            }

            if (data.length === 0) {
                list.innerHTML = `<div class="card" style="color: var(--text-secondary);">No pending submissions found.</div>`;
                return;
            }

            list.innerHTML = '';
            data.forEach(post => {
                const item = document.createElement('div');
                item.className = 'card';
                item.style.display = 'flex';
                item.style.justifyContent = 'space-between';
                item.style.alignItems = 'center';
                item.innerHTML = `
                    <div>
                        <h3 style="margin-bottom: 5px;">${post.title}</h3>
                        <p style="font-size: 0.9rem; color: var(--text-secondary);">By ${post.author_name} • ${post.category}</p>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button onclick="updateStatus('${post.id}', 'approved')" class="btn btn-primary" style="background: #10b981; border-color: #10b981;">Approve</button>
                        <button onclick="updateStatus('${post.id}', 'rejected')" class="btn" style="border: 1px solid #ef4444; color: #ef4444;">Reject</button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        async function updateStatus(id, status) {
            const { error } = await supabase
                .from('community_posts')
                .update({ status: status })
                .eq('id', id);

            if (error) {
                alert('Update failed: ' + error.message);
            } else {
                loadPending();
            }
        }

        document.addEventListener('DOMContentLoaded', checkAdmin);
    </script>
</body>

</html>
